[package]
name = "simple-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.4"
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.16"
